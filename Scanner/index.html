
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">

    <title>Contrôle des entrées</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <header>
        <h1>QR CODE SYSTEM</h1>
        <p>Contrôle des entrées</p>
    </header>

    <main>

        <section id="scanner">
            <div id="reader"></div>
            <p id="status">Prêt à scanner</p>
            <button id="start-button" onclick="startScanner()">
                Activer la caméra
            </button>
        </section>

        <section id="result" class="hidden">
            <h2 id="result-title"></h2>
            <p id="result-name"></p>
            <p id="result-class"></p>
            <p id="result-age"></p>
            <button onclick="resetScanner()">
                Scanner le prochain billet
            </button>
        </section>

        <section id="statistics">
            <h2>Statistiques</h2>
            <p>Entrées validées : <span id="count">0</span></p>
        </section>

    </main>

    <script src="html5-qrcode.min.js"></script>
    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>

</body>
</html>
